name = "symmetric_maximizer"
defaultTargets = ["SymmetricMaximizer"]
builtinLint = true
lintDriver = "batteries/runLinter"
lintDriverArgs = ["SymmetricMaximizer"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "SymmetricMaximizer"
